name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # Triggers on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Check out source
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Set up Java 17 (required for AGP 8.x)
      # ----------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ----------------------------------------------------------------
      # 3. Cache Gradle dependencies
      # ----------------------------------------------------------------
      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ----------------------------------------------------------------
      # 4. Make gradlew executable
      # ----------------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ----------------------------------------------------------------
      # 5. Decode the keystore from GitHub Secret (base64-encoded JKS)
      # ----------------------------------------------------------------
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "Keystore decoded."

      # ----------------------------------------------------------------
      # 6. Build the release APK (signed via environment variables)
      # ----------------------------------------------------------------
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      # ----------------------------------------------------------------
      # 7. Locate the output APK
      # ----------------------------------------------------------------
      - name: Find APK path
        id: apk_path
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      # ----------------------------------------------------------------
      # 8. Rename APK to include version tag
      # ----------------------------------------------------------------
      - name: Rename APK
        id: rename_apk
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ]; then
            VERSION="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          NEW_NAME="VerifySphere-${VERSION}.apk"
          cp "${{ steps.apk_path.outputs.apk_path }}" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Renamed to: $NEW_NAME"

      # ----------------------------------------------------------------
      # 9. Upload APK as workflow artifact (always available)
      # ----------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifySphere-APK
          path: ${{ steps.rename_apk.outputs.apk_name }}
          retention-days: 30

      # ----------------------------------------------------------------
      # 10. Create GitHub Release (only on version tags)
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_apk.outputs.apk_name }}
          name: "VerifySphere ${{ github.ref_name }}"
          body: |
            ## VerifySphere ${{ github.ref_name }}

            ### Installation
            1. Download `${{ steps.rename_apk.outputs.apk_name }}`
            2. Transfer to your Android device
            3. Enable **Install unknown apps** for your file manager in Settings → Apps
            4. Tap the APK to install

            ### Usage
            Open a `verifysphere://verify?data=<encrypted_payload>` link on the device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 11. Clean up keystore (security hygiene)
      # ----------------------------------------------------------------
      - name: Remove keystore
        if: always()
        run: rm -f app/keystore.jks
